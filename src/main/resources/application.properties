spring.application.name=ledger-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus

# O lock pessimista da transferência espera no máximo este tempo. O timeout é aplicado
# por SET LOCAL dentro da transação da transferência e vira 409 CONCURRENCY_CONFLICT
# retryable na borda, distinto do 409 de idempotência.
ledger.transfer.lock-timeout=${LEDGER_TRANSFER_LOCK_TIMEOUT:2s}
