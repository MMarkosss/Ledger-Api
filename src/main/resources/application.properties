spring.application.name=ledger-api
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,prometheus

# O lock pessimista da transferência espera no máximo este tempo. O timeout vira
# 409 CONCURRENCY_CONFLICT retryable na borda, distinto do 409 de idempotência.
ledger.transfer.lock-timeout=${LEDGER_TRANSFER_LOCK_TIMEOUT:2s}
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '${ledger.transfer.lock-timeout}'
